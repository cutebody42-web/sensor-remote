name: SENSOR Remote Access CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unified-build-not-win7-runtime:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-09-08
          components: rust-src
      - name: Build the same application with both OS graphics backends
        shell: pwsh
        run: ./scripts/build-unified-windows.ps1
      - name: Record hash-bound static import evidence (not Win7 runtime certification)
        shell: pwsh
        run: |
          ./scripts/audit-windows7-imports.ps1 -Executable target/x86_64-win7-windows-msvc/release/SENSOR-Remote.exe -Report unified-imports.json
      - uses: actions/upload-artifact@v7
        with:
          name: sensor-unified-compatibility-candidate-not-os-certified
          path: |
            target/x86_64-win7-windows-msvc/release/SENSOR-Remote.exe
            target/x86_64-win7-windows-msvc/release/SENSOR-CLI.exe
            unified-imports.json
          retention-days: 7
          if-no-files-found: error
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --workspace --locked
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build Windows executables
        if: runner.os == 'Windows'
        run: cargo build --workspace --release --locked
