name: SENSOR cross-network Windows fixture
on:
  workflow_dispatch:
    inputs:
      host_id:
        description: Temporary laptop fixture device ID (public)
        required: true
        type: string
      host_key:
        description: Temporary laptop fixture public identity key
        required: true
        type: string
permissions:
  contents: read
jobs:
  remote-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: Build isolated synthetic endpoint
        run: cargo build -p sensor-client --example cross_network --locked
      - name: Send and verify the synthetic file across networks
        shell: pwsh
        env:
          SENSOR_FIXTURE_ID: ${{ inputs.host_id }}
          SENSOR_FIXTURE_KEY: ${{ inputs.host_key }}
        run: |
          $ErrorActionPreference = 'Stop'
          $public = Join-Path $env:RUNNER_TEMP 'sensor-cross-network-public.json'
          $out = Join-Path $env:RUNNER_TEMP 'sensor-cross-network.log'
          if ($env:SENSOR_FIXTURE_ID -notmatch '^[1-9][0-9]{8}$' -or $env:SENSOR_FIXTURE_KEY -notmatch '^[0-9a-f]{64}$') { throw 'Invalid public fixture identity' }
          @{server='https://sensor-rendezvous-production.up.railway.app';device_id=[uint32]$env:SENSOR_FIXTURE_ID;public_key=$env:SENSOR_FIXTURE_KEY} | ConvertTo-Json | Set-Content $public -Encoding utf8NoBOM
          & '.\target\debug\examples\cross_network.exe' client $public 2>&1 | Tee-Object -FilePath $out
          if ($LASTEXITCODE -ne 0) { throw "Remote fixture failed: $LASTEXITCODE" }
          if ([string](Get-Content $out -Raw) -notmatch 'CROSS_NETWORK_CLIENT_PASS') { throw 'Missing positive transfer evidence' }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sensor-cross-network-evidence
          path: ${{ runner.temp }}/sensor-cross-network*.log
          retention-days: 7
