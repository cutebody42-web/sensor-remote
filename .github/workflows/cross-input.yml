name: SENSOR two-computer native input gate
on:
  workflow_dispatch:
    inputs:
      viewer_id:
        description: Temporary laptop viewer ID (public)
        required: true
        type: string
      viewer_key:
        description: Temporary laptop viewer public key
        required: true
        type: string
permissions:
  contents: read
jobs:
  cloud-input:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: Build actual native fixtures
        run: cargo build -p sensor-desktop --example cross_desktop --example qa_target --locked
      - name: Measure synthetic target and prepare identity
        shell: pwsh
        run: |
          & '.\target\debug\examples\cross_desktop.exe' prepare-control (Join-Path $env:RUNNER_TEMP 'sensor-input-profile') (Join-Path $env:RUNNER_TEMP 'sensor-input-public.json') (Join-Path (Get-Location) 'target\debug\examples\qa_target.exe')
          if ($LASTEXITCODE) { throw 'Native target preparation failed' }
      - uses: actions/upload-artifact@v7
        with:
          name: sensor-input-public
          path: |
            ${{ runner.temp }}/sensor-input-public.json
            ${{ runner.temp }}/sensor-input-profile/target-public.json
          retention-days: 1
          if-no-files-found: error
      - name: Require actual cloud input acknowledgement
        shell: pwsh
        env:
          SENSOR_VIEWER_ID: ${{ inputs.viewer_id }}
          SENSOR_VIEWER_KEY: ${{ inputs.viewer_key }}
        run: |
          if ($env:SENSOR_VIEWER_ID -notmatch '^[1-9][0-9]{8}$' -or $env:SENSOR_VIEWER_KEY -notmatch '^[0-9a-f]{64}$') { throw 'Invalid public identity' }
          $out = Join-Path $env:RUNNER_TEMP 'sensor-input.log'
          & '.\target\debug\examples\cross_desktop.exe' host-control (Join-Path $env:RUNNER_TEMP 'sensor-input-profile') $env:SENSOR_VIEWER_ID $env:SENSOR_VIEWER_KEY (Join-Path (Get-Location) 'target\debug\examples\qa_target.exe') 2>&1 | Tee-Object -FilePath $out
          if ($LASTEXITCODE) { throw 'Native host failed' }
          $evidence = Get-Content $out -Raw
          if ($evidence -notmatch 'CROSS_COMPUTER_INPUT_PASS' -or $evidence -notmatch 'CROSS_DESKTOP_HOST_PASS') { throw 'Two-computer native control has not passed' }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sensor-input-evidence
          path: ${{ runner.temp }}/sensor-input.log
          retention-days: 7
