[package]
name = "sensor-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
sensor-identity = { path = "../sensor-identity" }
zeroize.workspace = true
sensor-media = { path = "../sensor-media" }
sensor-session = { path = "../sensor-session" }
thiserror.workspace = true
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
arboard = { version = "3.6.1", default-features = false }
windows-sys = { workspace = true, features = ["Win32_System_Registry", "Win32_Security"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_StationsAndDesktops", "Win32_System_Threading", "Win32_System_RemoteDesktop", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile.workspace = true
