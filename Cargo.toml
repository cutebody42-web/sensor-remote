[workspace]
members = [
    "crates/sensor-core",
    "crates/sensor-crypto",
    "crates/sensor-identity",
    "crates/sensor-protocol",
    "crates/sensor-session",
    "crates/sensor-transport",
    "crates/sensor-windows",
    "crates/sensor-client",
    "crates/sensor-files",
    "crates/sensor-audit",
    "crates/sensor-relay",
    "crates/sensor-render",
    "crates/sensor-rendezvous",
    "crates/sensor-desktop",
    "crates/sensor-media",
]
resolver = "2"

[workspace.package]
version = "0.3.2"
edition = "2021"
rust-version = "1.98"
license = "LicenseRef-SENSOR-Proprietary"
authors = ["SENSOR TECHNOLOGY"]

[workspace.dependencies]
chacha20poly1305 = { version = "0.10.1", features = ["std"] }
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
hkdf = "0.12.4"
postcard = { version = "1.1.1", features = ["alloc"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde = { version = "1.0.214", features = ["derive"] }
sha2 = "0.10.8"
thiserror = "2.0.3"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
zeroize = { version = "1.8.1", features = ["zeroize_derive"] }
tempfile = "3.23"
fs2 = "0.4.3"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
cap-std = "4.0.3"
serde_json = "1.0"
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-native-roots"] }
